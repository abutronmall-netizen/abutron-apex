name: APEX 1.1.0 — offline source tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/apex11-dual-layer-demo-risk-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apex11-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apex11
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      APEX_API_TOKEN: ""
      DERIV_API_TOKEN: ""
      APEX_LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run APEX offline test suite (NO MT5 orders)
        run: |
          python -m pytest -q -p no:cacheprovider

# GitHub-hosted runner only. NEVER run these workflows on the production
# diagnostics self-hosted runner or grant Actions broker credentials.
