name: FP6364 LIVE read-only history - native Windows compile (NO ORDERS)
on:
  push:
    branches:
      - build/fp6364-usd-equity-20261113
    paths:
      - 'build/fp6364-history/**'
      - '.github/workflows/fp6364-usd-history-windows-compile.yml'

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Verify source and compile using official Windows MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $srcDir = Join-Path $env:GITHUB_WORKSPACE 'build\fp6364-history'
          $source = Join-Path $srcDir 'AbutronFPLiveHistory6364.mq5'
          function Assert-CanonicalSourceHash([string]$file, [string]$expected) {
            $text = [System.IO.File]::ReadAllText($file)
            $normalized = $text.Replace(([string][char]13 + [string][char]10), [string][char]10)
            $digest = ([System.Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($normalized)))).ToLowerInvariant()
            Write-Host "CANONICAL_SOURCE_SHA256=$digest"
            if ($digest -ne $expected) { throw "CANONICAL_SOURCE_SHA_MISMATCH_$file" }
          }
          Assert-CanonicalSourceHash $source '15d17b6bdd56e4db9fa8532e4868ce81a0d6e1a50ba10ce5de341caf2f9bc937'
          $body = Get-Content $source -Raw
          if ($body -notmatch 'ACCOUNT_TRADE_MODE_REAL' -or $body -notmatch 'ACCOUNT_CURRENCY\)=="USD"' -or $body -notmatch 'AccountInfoInteger\(ACCOUNT_LOGIN\)==86076364') { throw 'LIVE_HISTORY_ACCOUNT_BINDING_MISMATCH' }
          if ($body -match 'OrderSend\(' -or $body -match 'OrderCheck\(' -or $body -match 'TRADE_ACTION_DEAL' -or $body -match 'PositionClose\(') { throw 'HISTORY_SOURCE_NOT_READONLY' }
          $mt5Root = Join-Path $env:RUNNER_TEMP 'ABUTRON-MT5-NATIVE-COMPILER'
          New-Item -ItemType Directory -Force -Path $mt5Root | Out-Null
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.terminal.free/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer
          if ((Get-Item $installer).Length -lt 1000000) { throw 'MT5_INSTALLER_TOO_SMALL' }
          $sig = Get-AuthenticodeSignature $installer
          Write-Host "INSTALLER_SIGNATURE_STATUS=$($sig.Status)"
          Write-Host "INSTALLER_SIGNER=$($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'MetaQuotes') { throw 'MT5_INSTALLER_SIGNATURE_NOT_TRUSTED' }
          $setupArgs = '/auto /path:"' + $mt5Root + '"'
          $setup = Start-Process -FilePath $installer -ArgumentList $setupArgs -PassThru
          $editor = Join-Path $mt5Root 'MetaEditor64.exe'
          $deadline = (Get-Date).AddMinutes(5)
          while (!(Test-Path $editor) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 4 }
          if (!(Test-Path $editor)) { throw 'MT5_INSTALLER_METAEDITOR_NOT_FOUND' }
          Start-Sleep -Seconds 12
          Write-Host 'OFFICIAL_METAEDITOR_INSTALLED'
          $targetDir = Join-Path $mt5Root 'MQL5\Indicators\ABUTRON'
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          $target = Join-Path $targetDir 'AbutronFPLiveHistory6364.mq5'
          Copy-Item $source $target
          $log = [System.IO.Path]::ChangeExtension($target, '.log')
          $ex5 = [System.IO.Path]::ChangeExtension($target, '.ex5')
          Remove-Item $log,$ex5 -Force -ErrorAction SilentlyContinue
          $compileArgs = '/compile:"' + $target + '" /log /portable'
          $proc = Start-Process -FilePath $editor -ArgumentList $compileArgs -PassThru
          if (!$proc.WaitForExit(150000)) { $proc.Kill(); throw 'METAEDITOR_WINDOWS_TIMEOUT' }
          Write-Host "METAEDITOR_PROCESS_EXIT=$($proc.ExitCode)"
          if (!(Test-Path $log)) { throw 'METAEDITOR_NO_COMPILE_LOG' }
          $result = (Get-Content $log -Encoding Unicode | Where-Object { $_ -match '^Result:' } | Select-Object -Last 1)
          Write-Host "METAEDITOR_RESULT=$result"
          if ($result -notmatch '^Result: 0 errors') { throw 'METAEDITOR_SOURCE_ERRORS' }
          if (!(Test-Path $ex5) -or (Get-Item $ex5).Length -lt 10000) { throw 'READONLY_HISTORY_BINARY_NOT_PRODUCED' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-output'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $ex5 (Join-Path $out 'AbutronFPLiveHistory6364.ex5')
          Copy-Item $log (Join-Path $out 'AbutronFPLiveHistory6364.log')
          Write-Host "FP6364_USD_HISTORY_EX5_SHA256=$((Get-FileHash $ex5 -Algorithm SHA256).Hash.ToLower())"
          Write-Host 'SOURCE_COMPILED_ON_WINDOWS_NOT_DEPLOYED_NOT_AUTHORIZED'

      - name: Upload compiler-only artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fp6364-usd-history-readonly
          path: build-output/*
          retention-days: 7
