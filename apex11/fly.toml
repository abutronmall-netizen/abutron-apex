# fly.io variant — single machine + volume, same container and roles.
app = "apex-desk"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  APEX_DATA_DIR = "/var/data"
  APEX_ROLES = "web,collector,trader"
  APEX_CONFIG = "config/default.yaml"
  APEX_COLLECT_MINUTES = "60"

[[mounts]]
  source = "apex_data"
  destination = "/var/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"      # a trading loop must not be stopped
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
