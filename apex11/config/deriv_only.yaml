agents:
  regime:
    enabled: true
    lookback: 240
    adx_period: 14
    adx_trend_threshold: 22.0
    vol_percentile_high: 0.75
  trend:
    enabled: false                # reflection memory: t=-5.3 on synthetics -> disabled here
    fast: 20
    slow: 55
    atr_period: 14
  mean_reversion:
    enabled: true
    lookback: 40
    entry_z: 1.6
    exit_z: 0.4
  breakout:
    enabled: true
    channel: 55
    atr_period: 14
    atr_buffer: 0.35
  research:
    enabled: false
    refresh_every: 24
    max_veto_bars: 24
  carry:
    enabled: true
    min_strength: 0.25
  fusion:
    min_abs_weight: 0.015
    rebalance_threshold: 0.04
    smoothing: 0.5
    rebalance_every: 72
    memory_horizon: 24
    memory_min_obs: 40
    memory_influence: 0.0
risk:
  target_annual_vol: 0.15
  vol_target_band:
  - 0.08
  - 0.32
  per_trade_risk_pct: 0.0075
  max_position_weight: 0.35
  max_asset_class_weight:
    deriv_synthetic: 2.0
  max_gross_leverage: 2.0
  max_net_exposure: 1.5
  max_daily_loss_pct: 0.04
  max_drawdown_pct: 0.15
  var_confidence: 0.95
  var_limit_pct: 0.045
  corr_cluster_limit: 0.85
  cluster_weight_limit: 0.6
  kill_switch_action: flatten
  stop_atr_mult: 4.0
  stop_cooldown_bars: 12
execution:
  n_slices: 2
  participation_cap: 0.05
  impact_coef: 0.001
  min_notional: 10.0
  latency_ms: 120
  max_slippage_bps: 25
llm:
  enabled: false
  provider: openai
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  temperature: 0.1
  max_risk_scale: 0.6
  cooldown_bars: 12
  timeout_s: 20
live:
  deriv:
    app_id: '1089'
    endpoint: wss://ws.derivws.com/websockets/v3
    token_env: DERIV_API_TOKEN
    default_symbol_map:
      R_75: R_75
      R_100: R_100
      BOOM500: BOOM500
      CRASH500: CRASH500
      stpRNG: stpRNG
    stake_currency: USD
    max_stake_pct: 0.05
  alpaca:
    endpoint: https://paper-api.alpaca.markets
    key_env: ALPACA_KEY_ID
    secret_env: ALPACA_SECRET_KEY
backtest:
  start: 2024-01-01
  end: 2025-12-31
  bar: 1h
  bars_per_year: 6240
  slippage_bps: 1.0
  warmup_bars: 300
api:
  host: 0.0.0.0
  port: 8001
  stream_hz: 2
