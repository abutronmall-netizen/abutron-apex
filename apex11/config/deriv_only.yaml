  mode: paper
  base_currency: USD
  seed: 20261101
  log_dir: state
  decision_log: state/decisions_deriv.jsonl
  memory_file: state/memory_deriv.json
account:
  starting_equity: 100000.0
  leverage: 5.0
  margin_rate: 0.2
universe:
- symbol: R_75
  asset_class: deriv_synthetic
  tick_size: 0.0001
  spread_bps: 1.5
  commission_bps: 0.0
  annual_vol: 0.75
  ref_price: 105000
  max_weight: 0.35
  synthetic_model: volatility
- symbol: R_100
  asset_class: deriv_synthetic
  tick_size: 0.0001
  spread_bps: 1.5
  commission_bps: 0.0
  annual_vol: 1.0
  ref_price: 1600
  max_weight: 0.35
  synthetic_model: volatility
- symbol: BOOM500
  asset_class: deriv_synthetic
  tick_size: 0.0001
  spread_bps: 2.0
  commission_bps: 0.0
  annual_vol: 0.6
  ref_price: 9800
  max_weight: 0.25
  synthetic_model: boom
- symbol: CRASH500
  asset_class: deriv_synthetic
  tick_size: 0.0001
  spread_bps: 2.0
  commission_bps: 0.0
  annual_vol: 0.6
  ref_price: 7400
  max_weight: 0.25
  synthetic_model: crash
- symbol: stpRNG
  asset_class: deriv_synthetic
  tick_size: 0.1
  spread_bps: 2.0
  commission_bps: 0.0
  annual_vol: 0.35
